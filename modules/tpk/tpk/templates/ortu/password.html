{% extends "base.html" %}
{% block title %}Ganti Password{% endblock %}
{% block content %}
<section class="page">
  <div class="container narrow">
    <h1 class="page-title">Ganti Password</h1>
    <p class="page-sub">Akun: <strong>{{ current_user.username }}</strong></p>
    <form class="panel" method="post">
      <div class="form-grid">
        <div class="full">
          <label>Password lama</label>
          <input type="password" name="password_lama" required autocomplete="current-password">
        </div>
        <div>
          <label>Password baru</label>
          <input type="password" name="password_baru" required minlength="4" autocomplete="new-password">
        </div>
        <div>
          <label>Ulangi password baru</label>
          <input type="password" name="password_ulang" required minlength="4" autocomplete="new-password">
        </div>
      </div>
      <div class="actions">
        <button class="btn btn-primary" type="submit">Simpan Password</button>
        <a class="btn btn-secondary" href="{{ url_for('ortu.dashboard') }}">Batal</a>
      </div>
    </form>
  </div>
</section>
{% endblock %}
