<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Presensi SMP Muhammadiyah 22 Pamulang</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="{{ url_for('index') }}">Presensi SMPM 22</a>
            <button class="navbar-toggler" type="button" id="presensi-garis" aria-label="Buka menu" aria-controls="menu-presensi" aria-expanded="false">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="menu-presensi">
                <div class="navbar-nav">
                    <a class="nav-link text-white" href="/">Portal</a>
                    <a class="nav-link text-white" href="{{ url_for('input_presensi') }}">Form Presensi</a>
                    <a class="nav-link text-white" href="{{ url_for('laporan_harian') }}">Laporan Harian</a>
                    <a class="nav-link text-white" href="{{ url_for('rekap_bulanan') }}">Rekap Bulanan</a>
                    <a class="nav-link text-white" href="{{ url_for('master') }}">Data Siswa</a>
                </div>
            </div>
        </div>
    </nav>
    <div class="container">
        {% with messages = get_flashed_messages(with_categories=true) %}
        {% for jenis, pesan in messages %}
        <div class="alert alert-{{ 'success' if jenis == 'success' else 'warning' }}">{{ pesan }}</div>
        {% endfor %}
        {% endwith %}
        {% block content %}{% endblock %}
    </div>
    <script>
      document.getElementById("presensi-garis").addEventListener("click", function () {
        var menu = document.getElementById("menu-presensi");
        var buka = menu.classList.toggle("show");
        this.setAttribute("aria-expanded", buka ? "true" : "false");
      });
    </script>
</body>
</html>
