{% extends 'base.html' %}

{% block content %}
<div class="card shadow-sm p-4 mb-4 bg-white rounded" style="max-width: 520px;">
    <h4 class="mb-2 text-primary fw-bold">Ganti Password</h4>
    <p class="text-muted">Password baru dipakai saat masuk lagi. Minimal 6 karakter.</p>
    <form method="POST" action="/ganti-password">
        <input type="hidden" name="csrf" value="{{ csrf }}">
        <label class="form-label fw-bold" for="password-lama">Password saat ini</label>
        <input id="password-lama" class="form-control mb-3" type="password" name="password_lama" autocomplete="current-password" required style="min-height: 48px;">
        <label class="form-label fw-bold" for="password-baru">Password baru</label>
        <input id="password-baru" class="form-control mb-3" type="password" name="password_baru" autocomplete="new-password" minlength="6" maxlength="72" required style="min-height: 48px;">
        <label class="form-label fw-bold" for="password-ulang">Ulangi password baru</label>
        <input id="password-ulang" class="form-control mb-3" type="password" name="password_konfirmasi" autocomplete="new-password" minlength="6" maxlength="72" required style="min-height: 48px;">
        <button class="btn btn-primary" type="submit" style="min-height: 48px;">Simpan password</button>
    </form>
</div>
{% endblock %}
