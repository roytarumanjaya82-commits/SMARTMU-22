{% extends "base.html" %}
{% block title %}Profil Murid{% endblock %}
{% block content %}
<section class="page">
  <div class="container narrow">
    <h1 class="page-title">Profil Saya</h1>
    <form class="panel" method="post">
      <div class="form-grid">
        <div class="full"><label>Nama Lengkap</label><input name="nama_lengkap" value="{{ current_user.nama_lengkap }}" required></div>
        <div><label>NISN</label><input value="{{ murid.nisn }}" disabled></div>
        <div>
          <label>Jenis Kelamin</label>
          <select name="jenis_kelamin">
            <option value="">Pilih</option>
            <option value="L" {% if murid.jenis_kelamin=='L' %}selected{% endif %}>Laki-laki</option>
            <option value="P" {% if murid.jenis_kelamin=='P' %}selected{% endif %}>Perempuan</option>
          </select>
        </div>
        <div><label>Tempat Lahir</label><input name="tempat_lahir" value="{{ murid.tempat_lahir or '' }}"></div>
        <div><label>No. HP</label><input name="no_hp" value="{{ murid.no_hp or '' }}"></div>
        <div><label>Asal Sekolah</label><input name="asal_sekolah" value="{{ murid.asal_sekolah or '' }}"></div>
        <div><label>Nama Orang Tua</label><input name="nama_ortu" value="{{ murid.nama_ortu or '' }}"></div>
        <div><label>No. HP Orang Tua</label><input name="no_hp_ortu" value="{{ murid.no_hp_ortu or '' }}"></div>
        <div class="full"><label>Alamat</label><textarea name="alamat">{{ murid.alamat or '' }}</textarea></div>
        <div>
          <label>Pilihan Kelas 1</label>
          <select name="pilihan_kelas_1" required>
            {% for value, label in kelas_choices %}
              <option value="{{ value }}" {% if murid.pilihan_kelas_1==value %}selected{% endif %}>{{ label }}</option>
            {% endfor %}
          </select>
        </div>
        <div>
          <label>Pilihan Kelas 2</label>
          <select name="pilihan_kelas_2">
            <option value="">Tidak ada</option>
            {% for value, label in kelas_choices %}
              <option value="{{ value }}" {% if murid.pilihan_kelas_2==value %}selected{% endif %}>{{ label }}</option>
            {% endfor %}
          </select>
        </div>
      </div>
      <div class="actions"><button class="btn btn-primary" type="submit">Simpan Profil</button></div>
    </form>
  </div>
</section>
{% endblock %}
